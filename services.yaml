forcible_charge:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar
          model: "Batteries"
    duration:
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: "minutes"
          mode: box
    power:
      required: true
      default: 1000
      selector:
        text:

